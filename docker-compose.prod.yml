services:
  frigate-config-tool:
    image: ghcr.io/sunvidwong/frigate_config:latest
    container_name: frigate-config-tool
    networks:
      - frigate-network
    ports:
      - "15000:15000"  # Web UI 端口
    environment:
      - FRIGATE_HTTP_MODE=true
      - RUST_LOG=info
      - PORT=15000
    restart: unless-stopped

networks:
  frigate-network:
    driver: bridge

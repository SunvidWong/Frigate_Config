name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Build Go agent for all platforms
  build-agent:
    name: Build Agent (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - platform: linux-amd64
            os: ubuntu-latest
            target: linux
            arch: amd64
            ext: ''
          # Linux ARM64
          - platform: linux-arm64
            os: ubuntu-latest
            target: linux
            arch: arm64
            ext: ''
          # macOS x86_64
          - platform: darwin-amd64
            os: macos-latest
            target: darwin
            arch: amd64
            ext: ''
          # macOS ARM64
          - platform: darwin-arm64
            os: macos-latest
            target: darwin
            arch: arm64
            ext: ''
          # Windows x86_64
          - platform: windows-amd64
            os: windows-latest
            target: windows
            arch: amd64
            ext: '.exe'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache-dependency-path: agent/go.sum

      - name: Build Agent
        working-directory: agent
        env:
          GOOS: ${{ matrix.target }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -v -ldflags="-s -w" -o ../artifacts/agent-${{ matrix.platform }}${{ matrix.ext }} ./cmd/agent

      - name: Upload Agent Artifact
        uses: actions/upload-artifact@v3
        with:
          name: agent-${{ matrix.platform }}
          path: artifacts/agent-${{ matrix.platform }}${{ matrix.ext }}

  # Build Tauri application
  build-tauri:
    name: Build Tauri App (${{ matrix.platform }})
    needs: build-agent
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - platform: linux-x86_64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            agent_platform: linux-amd64
            bundle: appimage,deb

          # macOS x86_64
          - platform: macos-x86_64
            os: macos-12
            rust_target: x86_64-apple-darwin
            agent_platform: darwin-amd64
            bundle: dmg,app

          # macOS ARM64
          - platform: macos-aarch64
            os: macos-14
            rust_target: aarch64-apple-darwin
            agent_platform: darwin-arm64
            bundle: dmg,app

          # Windows x86_64
          - platform: windows-x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            agent_platform: windows-amd64
            bundle: msi,nsis

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Download Agent Binary
        uses: actions/download-artifact@v3
        with:
          name: agent-${{ matrix.agent_platform }}
          path: src-tauri/bin/

      - name: Make Agent Executable (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          chmod +x src-tauri/bin/agent-${{ matrix.agent_platform }}
          mv src-tauri/bin/agent-${{ matrix.agent_platform }} src-tauri/bin/agent

      - name: Rename Agent (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mv src-tauri/bin/agent-${{ matrix.agent_platform }}.exe src-tauri/bin/agent.exe

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Frigate Config Tool ${{ github.ref_name }}'
          releaseBody: |
            ## What's New

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ## Installation

            ### Linux
            - **AppImage**: Download and run (no installation needed)
            - **Debian/Ubuntu**: Install the `.deb` package

            ### macOS
            - Download the `.dmg` file
            - Drag to Applications folder
            - **Note**: First launch requires right-click > Open (Gatekeeper)

            ### Windows
            - Run the `.msi` installer
            - Or use the `.exe` portable version

            ## Checksums

            ```
            # Checksums will be added here automatically
            ```

            ---

            🤖 Built with [Claude Code](https://claude.com/claude-code)
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundle }}

  # Create GitHub Release
  create-release:
    name: Create GitHub Release
    needs: [build-agent, build-tauri]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/

      - name: Generate Checksums
        run: |
          cd artifacts
          find . -type f -exec sha256sum {} \; > checksums.txt
          cat checksums.txt

      - name: Create Release Notes
        run: |
          echo "## Frigate Configuration Tool ${GITHUB_REF#refs/tags/}" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Downloads" >> release_notes.md
          echo "" >> release_notes.md
          echo "#### Linux" >> release_notes.md
          echo "- AppImage (x86_64): Universal Linux package" >> release_notes.md
          echo "- Debian/Ubuntu: .deb package" >> release_notes.md
          echo "" >> release_notes.md
          echo "#### macOS" >> release_notes.md
          echo "- Intel (x86_64): For Intel Macs" >> release_notes.md
          echo "- Apple Silicon (ARM64): For M1/M2/M3 Macs" >> release_notes.md
          echo "" >> release_notes.md
          echo "#### Windows" >> release_notes.md
          echo "- MSI Installer: Standard installation" >> release_notes.md
          echo "- NSIS Installer: Alternative installer" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Checksums" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
          cat artifacts/checksums.txt >> release_notes.md
          echo "\`\`\`" >> release_notes.md

      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

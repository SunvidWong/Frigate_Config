version: '3.8'

services:
  frigate-config-tool:
    image: frigate-config-ui:latest  # 使用现有镜像作为基础
    container_name: frigate-config-tool-phase8
    networks:
      - frigate-network
    ports:
      - "15000:15000"  # Web UI 端口
    volumes:
      # 挂载已构建的二进制和前端资源
      - ./target/release/frigate-config-tool:/app/frigate-config-tool:ro
      - ./src-ui/dist:/app/web:ro
      # 数据持久化
      - frigate-config-data:/app/data
      - frigate-config-db:/root/.frigate-config-tool
      # Phase 8 卷映射示例
      - frigate-config:/config
      - frigate-recordings:/media/frigate/recordings
      - frigate-clips:/media/frigate/clips
      - frigate-cache:/tmp/cache
    environment:
      - RUST_LOG=info
      - FRIGATE_CONFIG_DATA_DIR=/app/data
      - NODE_ENV=production
      - FRIGATE_HTTP_MODE=true
      - PORT=15000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:15000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      - "com.frigate.phase=8"
      - "com.frigate.feature=disk-volume-mapping"

  # Frigate 主服务 (如果需要)
  # frigate:
  #   image: ghcr.io/blakeblackshear/frigate:stable
  #   container_name: frigate
  #   restart: unless-stopped
  #   network_mode: host  # 使用 host 网络模式
  #   volumes:
  #     - frigate-config:/config
  #     - frigate-recordings:/media/frigate/recordings
  #     - frigate-clips:/media/frigate/clips
  #     - frigate-cache:/tmp/cache
  #   # 注意: host 模式下不需要 ports 配置，服务直接使用宿主机端口
  #   # ports:
  #   #   - "5000:5000"
  #   #   - "8554:8554"  # RTSP

volumes:
  frigate-config-data:
    driver: local
    labels:
      - "com.frigate.phase8.data=true"

  frigate-config-db:
    driver: local
    labels:
      - "com.frigate.phase8.database=true"

  # Phase 8 功能创建的卷映射
  frigate-config:
    driver: local
    driver_opts:
      type: none
      device: ${HOME}/frigate/config
      o: bind

  frigate-recordings:
    driver: local
    driver_opts:
      type: none
      device: ${HOME}/frigate/recordings
      o: bind

  frigate-clips:
    driver: local
    driver_opts:
      type: none
      device: ${HOME}/frigate/clips
      o: bind

  frigate-cache:
    driver: local
    driver_opts:
      type: none
      device: ${HOME}/frigate/cache
      o: bind

networks:
  frigate-network:
    driver: bridge
    labels:
      - "com.frigate.network=true"

# 注意事项:
# - 使用 bridge 网络模式，通过端口映射访问服务
# - Web UI 通过 http://localhost:15000 访问
# - 容器内部扫描功能可能受限，建议在宿主机或 Linux 环境使用 Tauri 桌面模式进行网络扫描
# - macOS/Windows Docker Desktop 上推荐使用 bridge 网络模式
# - 确保宿主机 15000 端口未被占用

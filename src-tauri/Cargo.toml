[package]
name = "frigate-config-tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tokio.workspace = true

# YAML processing
serde_yaml = "0.9"
yaml-rust2 = "0.8"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File system operations
fs_extra = "1.3"
tempfile = "3.8"

# HTTP for health checks
reqwest = { version = "0.11", features = ["json"] }

# HTTP server for Docker mode
axum = { version = "0.7", features = ["tokio"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Crypto for checksums
sha2 = "0.10"
hex = "0.4"

# Directory utilities
dirs = "5.0"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Async utilities for camera discovery
futures = "0.3"

# Network interface discovery
if-addrs = "0.12"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Test targets for User Story 3
[[test]]
name = "test_docker_commands"
path = "../tests/unit/test_docker_commands.rs"

[[test]]
name = "test_deployment_validation"
path = "../tests/unit/test_deployment_validation.rs"

[[test]]
name = "test_deployment"
path = "../tests/integration/test_deployment.rs"

[[test]]
name = "test_health_check"
path = "../tests/integration/test_health_check.rs"

[[test]]
name = "test_deployment_rollback"
path = "../tests/integration/test_deployment_rollback.rs"

# Test targets for User Story 4
[[test]]
name = "test_arm_detection"
path = "../tests/integration/test_arm_detection.rs"
